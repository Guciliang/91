# backend 配置示例。首次启动若未发现 config.yaml，会基于此文件自动创建。
server:
  # 本地开发默认配合 vite.config.ts 的代理端口。
  listen: "127.0.0.1:9192"
  # 管理后台用户。保留默认值时，首次访问登录页会要求设置新用户名和密码，
  # 并写回 backend/config.yaml。
  # CORS 白名单：允许跨源访问的前端 Origin 列表。默认空 = 不允许任何跨源请求。
  # 同源部署（前后端在同一域名 + 端口下，由 nginx 反代）不需要配此项。
  # 仅在前后端分别部署在不同域名/端口、且需要前端 fetch 后端时填写。
  # 不要写 "*"；带 cookie 的 CORS 必须列具体 Origin。
  # 示例：
  # allowed_origins:
  #   - "https://video.example.com"
  #   - "http://127.0.0.1:9191"
  allowed_origins: []

storage:
  # SQLite 数据库文件路径
  db_path: "./data/video-site.db"
  # 本地预览视频和封面目录
  local_preview_dir: "./data/previews"

logging:
  # 后台日志同时保留在磁盘；stdout/stderr 仍继续交给 Docker 或 systemd 收集。
  file_enabled: true
  # 放在 data 下可随 Docker 数据卷持久化，但不会进入业务备份包。
  directory: "./data/logs"
  # 单个日志文件达到此大小后轮转。
  max_file_size_mb: 10
  # 超过总量后从最旧的轮转文件开始清理。
  max_total_size_mb: 50

scanner:
  # 已废弃：旧版的"每天 02:00-07:00 按 IntervalSeconds 间隔重复扫盘"已被移除。
  # 现在所有定时任务统一由 nightly 调度器控制（默认每天 01:00 跑一条完整流水线）。
  # 字段保留仅为兼容旧 yaml，运行时被忽略。
  interval_seconds: 0
  # 单次扫描每家网盘目录递归层数上限
  max_depth: 5
  # 被扫描的扩展名
  video_extensions: [".mp4", ".mkv", ".mov", ".webm", ".avi", ".strm"]

nightly:
  # 凌晨流水线的每日启动时间，24 小时制 HH:mm；后台保存后会热更新。
  # 运行时会统一编排扫描、媒体资产生成和后续清理任务。
  start_time: "01:00"

tags:
  # 是否启用系统内置标签包；后台保存后会热更新。
  builtin_pack_enabled: true

preview:
  # 是否启用 ffmpeg 抽帧生成预览视频
  enabled: true
  # ffmpeg / ffprobe 可执行文件名或绝对路径
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"
  # 预览视频每段时长（秒），实际生成时每段最多 3 秒
  duration_seconds: 3
  # 兼容旧配置；当前 30 秒以下最多 3 段，30 秒及以上固定 4 段
  segments: 3
  # 预览视频宽度
  width: 480

proxy:
  # 是否允许播放器为“三屏画面”请求服务端全量中转视频流。
  # 关闭后，支持直链的网盘仍保持 302，避免客户端主动消耗服务端上行带宽。
  allow_forced_relay: true

remote_upload:
  # 视频直链后台下载时始终保留的数据盘空间，默认 1 GiB。
  disk_reserve_bytes: 1073741824
  # 已收到响应头后，正文连续无数据多久判定失败。
  idle_timeout_seconds: 120

# 盘列表。上线后请通过管理后台添加，本文件可留空。
# kind 支持 quark / p115 / p123 / pikpak / wopan / guangyapan / onedrive / googledrive / webdav / localstorage。
# OneDrive 示例：
# - id: "my-onedrive"
#   kind: "onedrive"
#   name: "我的 OneDrive"
#   root_id: "root"
#   params:
#     refresh_token: "..."
# Google Drive 示例：
# - id: "my-google"
#   kind: "googledrive"
#   name: "我的 Google Drive"
#   root_id: "root"
#   params:
#     refresh_token: "..."
#     client_id: "..."
#     client_secret: "..."
# 光鸭网盘示例：
# - id: "my-guangyapan"
#   kind: "guangyapan"
#   name: "我的光鸭网盘"
#   # 留空表示光鸭网盘根目录；也可以填写光鸭目录 fileId
#   root_id: ""
#   params:
#     # 推荐在后台使用扫码登录自动写入 access_token / refresh_token。
#     refresh_token: "..."
#     # 可选：按路径解析扫描根目录，优先于 root_id
#     # root_path: "影视/电影"
# WebDAV 示例（OpenList 通常为 https://example.com/dav）：
# - id: "my-webdav"
#   kind: "webdav"
#   name: "我的 WebDAV"
#   # WebDAV 端点下的绝对路径；留空时为 /
#   root_id: "/影视"
#   params:
#     base_url: "https://example.com/dav"
#     username: "..."
#     password: "..."
#     # 可选：允许 .strm 指向当前 WebDAV 根目录外的路径；仍限制在该 WebDAV 端点内。
#     # 默认 false，防止 .strm 无意访问根目录外的文件。
#     strm_allow_outside_root: false
# 本地存储示例：
# - id: "local-media"
#   kind: "localstorage"
#   name: "本地视频目录"
#   root_id: "/"
#   params:
#     # Docker 部署时这里和 .strm 里的绝对路径都必须使用容器内路径。
#     # 例如宿主机 /mnt/videos 挂载为 /media，就填写 /media。
#     path: "/mnt/videos"
drives: []
