services:
  video-site-91:
    image: ghcr.io/nianzhibai/91:stable
    container_name: video-site-91
    ports:
      - "9191:9191"
    environment:
      VIDEO_RESTART_MANAGED: "true"
      VIDEO_TELEGRAM_COMPOSE: /opt/video-site-91/telegram.yml
    volumes:
      - ./data:/opt/video-site-91/data
      - ./data/telegram:/var/lib/telegram-bot-api
      # 网站从本部署文件读取 Bot API 端口和共享数据目录配置。
      - ./docker-compose.yml:/opt/video-site-91/telegram.yml:ro
    depends_on:
      - telegram-bot-api
    restart: unless-stopped

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      # 必填：从 my.telegram.org 的 API development tools 获取。
      TELEGRAM_API_ID: ""
      TELEGRAM_API_HASH: ""
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "7878"
    stop_grace_period: 30s
    volumes:
      - ./data/telegram:/var/lib/telegram-bot-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
