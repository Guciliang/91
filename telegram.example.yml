name: video-site-telegram
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      # Required: obtain application credentials from my.telegram.org.
      # Configure the Bot Token in the website panel.
      TELEGRAM_API_ID: ""
      TELEGRAM_API_HASH: ""
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "7878"
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - ./data/telegram:/var/lib/telegram-bot-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
